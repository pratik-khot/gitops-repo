# Example only. This file is not referenced by any Kustomization and is not deployed.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: example-secrets
  namespace: <application-namespace>
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: <aws-secrets-manager-secret-name>
        objectType: secretsmanager
  # secretObjects is optional. Add it only when the application requires
  # synchronization into a Kubernetes Secret.
