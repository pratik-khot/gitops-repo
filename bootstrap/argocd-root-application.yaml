apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/pratik-khot/gitops-repo.git
      targetRevision: main
      path: charts/argocd-application-inventory
      helm:
        valueFiles:
          - $values/environments/dev/applications.yaml
    - repoURL: https://github.com/pratik-khot/gitops-repo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
