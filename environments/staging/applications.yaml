clusterConfig:
  clusterFullName: REPLACE_WITH_STAGING_EKS_CLUSTER_NAME
  environment: staging
  awsRegion: REPLACE_WITH_STAGING_AWS_REGION

apps:
  vote-app:
    enabled: false
    installer: kustomize
    path: apps/vote-app/overlays/staging
