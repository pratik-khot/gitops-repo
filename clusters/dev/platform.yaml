apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    gitops.example.com/environment: dev
spec:
  project: platform
  source:
    repoURL: https://github.com/pratik-khot/gitops-repo.git
    targetRevision: main
    path: platform/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
