apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    gitops.example.com/environment: staging
spec:
  project: apps
  source:
    repoURL: https://github.com/pratik-khot/gitops-repo.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
