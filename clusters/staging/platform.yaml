apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-platform
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/pratik-khot/gitops-repo.git
    targetRevision: main
    path: platform/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
